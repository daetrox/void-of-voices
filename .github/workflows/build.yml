name: Compilar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: AppImage (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 file
      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install --no-deps pyrnnoise
      - name: Prueba rápida
        run: python main.py --selftest
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/vozcandalo.spec
      - name: Prueba del ejecutable
        run: dist/Vozcandalo/vozcandalo --selftest
      - name: AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          packaging/linux/build_appimage.sh "$VERSION" dist/Vozcandalo
          ./Vozcandalo-*-x86_64.AppImage --appimage-extract-and-run --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Vozcandalo-*-x86_64.AppImage

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install --no-deps pyrnnoise
      - name: Prueba rápida
        run: python main.py --selftest
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/vozcandalo.spec
      - name: Prueba del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Vozcandalo\Vozcandalo.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Versión
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - name: ZIP portable
        shell: pwsh
        run: Compress-Archive -Path dist\Vozcandalo -DestinationPath "Vozcandalo-${{ steps.ver.outputs.v }}-Windows-portable.zip"
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.v }}" packaging\windows\vozcandalo.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Vozcandalo-*-Windows-portable.zip
            Vozcandalo-*-Windows-Setup.exe

  release:
    name: Publicar en la release
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Vozcándalo ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: out/*
          fail_on_unmatched_files: true
